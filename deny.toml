# cargo-deny: `cargo deny check licenses`
[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
# Unicode-DFS-2016 is allowed but no crate in the tree uses it today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

