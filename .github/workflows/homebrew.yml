# Publishing a GitHub Release (not a draft, not a pre-release) pushes its
# Homebrew formula, the lanework-kit.rb asset release.yml attached, to
# lanework-dev/homebrew-tap. Running only after publish means the tap never
# points at download URLs that still 404.
#
# The job uses the `release` environment (its required reviewer approves it)
# for the HOMEBREW_TAP_TOKEN secret; see release.yml for the setup.
name: homebrew

on:
  release:
    types: [published]
  # Re-push the formula of an already published release by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: publish formula to lanework-dev/homebrew-tap
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download the formula from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'lanework-kit.rb' --dir formula
          grep -q "version \"${TAG#v}\"" formula/lanework-kit.rb || {
            echo "::error::formula does not carry version ${TAG#v}"; exit 1; }
          # Every archive URL in it must answer now that the release is public.
          for url in $(grep -o 'https://[^"]*\.tar\.xz' formula/lanework-kit.rb); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -L "$url")"
            [ "$code" = 200 ] || { echo "::error::$url answered $code"; exit 1; }
          done
      - name: Push the formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/lanework-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp formula/lanework-kit.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "Formula unchanged."
          else
            git commit -m "lanework-kit ${TAG#v}"
            git push origin HEAD
          fi
