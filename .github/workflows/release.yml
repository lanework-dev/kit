# A `v*` tag builds lwk for four targets with cargo-dist (`dist`), signs the
# macOS binaries, notarizes them, attaches the archives, the shell installer
# and the Homebrew formula to a DRAFT GitHub Release; once the maintainer
# publishes it, approving `publish-homebrew` pushes the formula to
# lanework-dev/homebrew-tap.
#
#   git tag v0.1.0 && git push origin v0.1.0   # tag == Cargo.toml version
#
# Targets: aarch64-apple-darwin, x86_64-apple-darwin,
#          aarch64-unknown-linux-musl, x86_64-unknown-linux-musl.
# Every archive holds lwk, LICENSE and THIRD_PARTY_LICENSES.md
# (dist-workspace.toml `include`).
#
# Setup, once, in Settings > Environments > `release` (required reviewers:
# the maintainer; deployment tags: `v*`). Secrets:
#
#   APPLE_CERT_P12_BASE64   Developer ID Application certificate + private
#                           key, exported from Keychain Access as .p12, then
#                           `base64 -i cert.p12`
#   APPLE_CERT_PASSWORD     the .p12's export password
#   APPLE_SIGNING_IDENTITY  the certificate's full name, e.g.
#                           "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8        contents of an App Store Connect API key
#                           (AuthKey_<id>.p8), used by notarytool
#   APPLE_API_KEY_ID        that key's Key ID
#   APPLE_API_ISSUER        the App Store Connect Issuer ID
#   HOMEBREW_TAP_TOKEN      a token that can push to lanework-dev/homebrew-tap
#                           (fine-grained PAT, Contents: read and write)
#
# A pre-release tag (anything with a `-`, e.g. v0.1.0-rc.1; Cargo.toml must
# carry the same version) makes a draft pre-release and never touches the tap.
#
# Action versions other than checkout are tags, not pinned SHAs (TODO: pin).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: 0.30.0

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Plan
        id: plan
        run: |
          dist plan --tag="$GITHUB_REF_NAME" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local:
    name: build ${{ matrix.target }}
    needs: plan
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Native Intel runner: dist does not sign a cross-compiled binary.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (macOS, signed by dist)
        if: contains(matrix.target, 'apple-darwin')
        env:
          # dist's `macos-sign` reads these; the APPLE_* secrets feed them.
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CODESIGN_CERTIFICATE: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          # Hardened runtime: notarization refuses binaries without it.
          CODESIGN_OPTIONS: runtime
        run: dist build --tag="$GITHUB_REF_NAME" --target=${{ matrix.target }} --artifacts=local --output-format=json > dist-manifest.json

      - name: Build (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: dist build --tag="$GITHUB_REF_NAME" --target=${{ matrix.target }} --artifacts=local --output-format=json > dist-manifest.json

      # Gatekeeper wants a notarized ticket for a downloaded binary. A bare
      # Mach-O cannot be stapled, so the ticket stays with Apple; the archive
      # is not changed (its checksum, and the formula's, stay right).
      - name: Notarize the macOS binary
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ matrix.target }}
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/notarize.XXXXXX")"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$work/AuthKey.p8"
          archive="$(ls target/distrib/*-"$TARGET".tar.* | head -n1)"
          mkdir "$work/unpacked"
          tar -xf "$archive" -C "$work/unpacked"
          bin="$(find "$work/unpacked" -type f -name lwk | head -n1)"
          codesign --verify --strict --verbose=2 "$bin"
          ditto -c -k --keepParent "$bin" "$work/lwk.zip"
          xcrun notarytool submit "$work/lwk.zip" --wait \
            --key "$work/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            target/distrib/*.tar.*
            target/distrib/*.sha256
            dist-manifest.json

  build-global:
    name: installers
    needs: [plan, build-local]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build the shell installer and the Homebrew formula
        run: |
          dist build --tag="$GITHUB_REF_NAME" --artifacts=global --output-format=json > dist-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*.rb
            target/distrib/*.sha256

  host:
    name: draft release
    needs: [plan, build-local, build-global]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/distrib
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$TAG" --generate-notes \
            ./*.tar.* ./*.sha256 ./*-installer.sh ./*.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: target/distrib/*.rb

  # The formula's URLs point at the release, which is public only once the
  # draft is published. This job waits on the `release` environment's required
  # reviewer: press Publish on the draft FIRST, then approve this job.
  publish-homebrew:
    name: publish formula to lanework-dev/homebrew-tap
    needs: host
    # Pre-releases (v0.1.0-rc.1) never reach the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: formula
      - name: Push the formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/lanework-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp formula/*.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "Formula unchanged."
          else
            git commit -m "lanework-kit ${TAG#v}"
            git push origin HEAD
          fi
