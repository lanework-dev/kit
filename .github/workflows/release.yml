# A `v*` tag builds lwk for four targets with cargo-dist (`dist`), signs the
# macOS binaries, notarizes them, attaches the archives, the shell installer
# and the Homebrew formula to a DRAFT GitHub Release. Publishing that draft
# starts homebrew.yml, which (after approval) pushes the formula to
# lanework-dev/homebrew-tap, so the tap never points at a draft.
#
#   git tag v0.1.0 && git push origin v0.1.0   # tag == Cargo.toml version
#
# Targets: aarch64-apple-darwin, x86_64-apple-darwin,
#          aarch64-unknown-linux-musl, x86_64-unknown-linux-musl.
# Every archive holds lwk, LICENSE and THIRD_PARTY_LICENSES.md
# (dist-workspace.toml `include`).
#
# Setup, once, in Settings > Environments > `release` (required reviewers:
# the maintainer; deployment tags: `v*`). Secrets:
#
#   APPLE_CERT_P12_BASE64   Developer ID Application certificate + private
#                           key, exported from Keychain Access as .p12, then
#                           `base64 -i cert.p12`
#   APPLE_CERT_PASSWORD     the .p12's export password
#   APPLE_SIGNING_IDENTITY  the certificate's full name, e.g.
#                           "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_P8        contents of an App Store Connect API key
#                           (AuthKey_<id>.p8), used by notarytool
#   APPLE_API_KEY_ID        that key's Key ID
#   APPLE_API_ISSUER        the App Store Connect Issuer ID
#   HOMEBREW_TAP_TOKEN      a token that can push to lanework-dev/homebrew-tap
#                           (fine-grained PAT, Contents: read and write)
#
# A pre-release tag (anything with a `-`, e.g. v0.1.0-rc.1; Cargo.toml must
# carry the same version) makes a draft pre-release and never touches the tap.
#
# Action versions other than checkout are tags, not pinned SHAs (TODO: pin).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: 0.30.0

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Plan
        id: plan
        run: |
          dist plan --tag="$GITHUB_REF_NAME" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local:
    name: build ${{ matrix.target }}
    needs: plan
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Native Intel runner: dist does not sign a cross-compiled binary.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Dependencies only, one cache per target: rust-cache drops the
      # workspace's own crates (lwk is always rebuilt and signed here).
      # A tag run reads caches of its own ref or of main, so this helps
      # re-runs of a release; a new tag starts cold unless main has one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-workspace-crates: false
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # dist 0.30 left the binary unsigned (only the linker's ad-hoc
      # signature on arm64), so the binary is signed here, between cargo's
      # build and dist's packaging: dist's own `cargo build` then finds it
      # fresh and packs the signed file as it is.
      - name: Build and sign (macOS)
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          # The Developer ID intermediate, in case the .p12 lacks the chain:
          # without it the identity is untrusted and codesign cannot use it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          # codesign looks identities up through the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sign by the identity's SHA-1, found in this keychain: immune to a
          # stray space or newline in the APPLE_SIGNING_IDENTITY secret.
          security find-identity -v -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No valid Developer ID Application identity in the imported certificate"
            exit 1
          fi

          # Exactly dist's own cargo call (RUSTFLAGS="" included: dist always
          # passes it), so dist's build below finds everything fresh instead
          # of rebuilding over the signed binary.
          RUSTFLAGS="" cargo build --profile dist --message-format=json-render-diagnostics \
            --target "$TARGET" --workspace > /dev/null
          # The final binary and the copy cargo keeps in its build dir (the
          # one it copies back over the final one on every build).
          for bin in "target/$TARGET/dist/lwk" target/"$TARGET"/dist/build/lanework-kit/*/out/lwk; do
            [ -f "$bin" ] || continue
            codesign --force --options runtime --timestamp \
              --keychain "$keychain" --sign "$identity" "$bin"
          done
          codesign --verify --strict --verbose=2 "target/$TARGET/dist/lwk"

          # Per-target manifest, beside the archives (as dist's own CI does):
          # the global step merges them all for the installers' checksums.
          dist build --tag="$GITHUB_REF_NAME" --target="$TARGET" --artifacts=local --output-format=json > "$RUNNER_TEMP/dist-manifest.json"
          cp "$RUNNER_TEMP/dist-manifest.json" "target/distrib/$TARGET-dist-manifest.json"
          codesign -dvv "target/$TARGET/dist/lwk" 2>&1 | grep -q '^Authority=Developer ID Application' || {
            echo "::error::dist rebuilt lwk after signing (its cargo call no longer matches ours)"; exit 1; }
          security delete-keychain "$keychain"

      - name: Build (Linux)
        if: contains(matrix.target, 'linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dist build --tag="$GITHUB_REF_NAME" --target="$TARGET" --artifacts=local --output-format=json > "$RUNNER_TEMP/dist-manifest.json"
          cp "$RUNNER_TEMP/dist-manifest.json" "target/distrib/$TARGET-dist-manifest.json"

      # Gatekeeper wants a notarized ticket for a downloaded binary. A bare
      # Mach-O cannot be stapled, so the ticket stays with Apple; the archive
      # is not changed (its checksum, and the formula's, stay right).
      - name: Notarize the macOS binary
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ matrix.target }}
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/notarize.XXXXXX")"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$work/AuthKey.p8"
          archive="target/distrib/lanework-kit-$TARGET.tar.xz"
          mkdir "$work/unpacked"
          tar -xf "$archive" -C "$work/unpacked"
          bin="$(find "$work/unpacked" -type f -name lwk | head -n1)"
          # The packed binary must carry the Developer ID signature, not the
          # linker's ad-hoc one.
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dvv "$bin" 2>&1 | grep -q '^Authority=Developer ID Application' || {
            echo "::error::$bin is not signed with the Developer ID"; exit 1; }
          ditto -c -k --keepParent "$bin" "$work/lwk.zip"
          # notarytool exits 0 even when Apple answers Invalid: check the status.
          xcrun notarytool submit "$work/lwk.zip" --wait --output-format json \
            --key "$work/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            > "$work/result.json"
          cat "$work/result.json"
          status="$(plutil -extract status raw -o - "$work/result.json")"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw -o - "$work/result.json")"
            xcrun notarytool log "$id" \
              --key "$work/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::Notarization status: $status"
            exit 1
          fi
          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ matrix.target }}
          # Only files under target/distrib: the artifact keeps them flat.
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.tar.xz.sha256
            target/distrib/*-dist-manifest.json
          if-no-files-found: error

  build-global:
    name: installers
    needs: [plan, build-local]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build the shell installer and the Homebrew formula
        run: |
          ls -l target/distrib
          dist build --tag="$GITHUB_REF_NAME" --artifacts=global --output-format=json > "$RUNNER_TEMP/global-dist-manifest.json"
          # Every archive must have its checksum in the formula.
          n="$(grep -c 'sha256 "' target/distrib/lanework-kit.rb)"
          if [ "$n" != 4 ]; then
            echo "::error::lanework-kit.rb has $n sha256 lines, expected 4"; cat target/distrib/lanework-kit.rb; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            target/distrib/*-installer.sh
            target/distrib/*.rb
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
            target/distrib/sha256.sum
          if-no-files-found: error

  host:
    name: draft release
    needs: [plan, build-local, build-global]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/distrib
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # Each file once (`*.tar.*` used to match the .sha256 files too, and
          # the duplicate upload failed with a 404); all must be there.
          shopt -s failglob
          files=(./*.tar.xz ./*.tar.xz.sha256 ./*-installer.sh ./*.rb ./source.tar.gz ./source.tar.gz.sha256 ./sha256.sum)
          if [ "$(ls ./*.tar.xz | grep -vc source)" != 4 ]; then
            echo "::error::expected 4 archives"; ls -l; exit 1
          fi
          ls -l "${files[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "$TAG" --generate-notes "${files[@]}"
